<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #7b8794;
      --accent: #4f46e5;
      --border: #e5e7eb;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    .app {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
      padding: 32px;
      height: fit-content;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 20px;
    }
    .add-form { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 15px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .15);
    }
    .add-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s;
    }
    .add-btn:hover { background: #4338ca; }
    .filters {
      display: flex;
      gap: 4px;
      background: var(--bg);
      padding: 4px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .filters button {
      flex: 1;
      border: none;
      background: transparent;
      padding: 7px 0;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: background .15s, color .15s;
    }
    .filters button.active {
      background: var(--card);
      color: var(--accent);
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
    }
    ul.list { list-style: none; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
    }
    li:last-child { border-bottom: none; }
    li.completed .task-text { text-decoration: line-through; color: var(--muted); }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .task-text {
      flex: 1;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-word;
    }
    .edit-input {
      flex: 1;
      font-size: 15px;
      padding: 4px 8px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      font-family: inherit;
      outline: none;
    }
    .item-actions { display: flex; gap: 4px; flex-shrink: 0; }
    .icon-btn {
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
      border-radius: 6px;
      line-height: 1;
      opacity: .55;
      font-family: inherit;
      transition: opacity .15s, background .15s;
    }
    .icon-btn:hover { opacity: 1; background: var(--bg); }
    .icon-btn.delete:hover { color: var(--danger); }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 32px 0;
      font-size: 14px;
    }
    .hidden { display: none !important; }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
    }
    .clear-btn {
      border: none;
      background: none;
      color: var(--danger);
      font-size: 13px;
      cursor: pointer;
      padding: 0;
      font-family: inherit;
      opacity: .8;
      transition: opacity .15s;
    }
    .clear-btn:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <h1>To-Do</h1>
    <p class="subtitle">Get things done.</p>

    <form id="add-form" class="add-form" autocomplete="off">
      <input type="text" id="new-task" placeholder="What needs to be done?" aria-label="New task">
      <button type="submit" class="add-btn">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" class="active">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="completed">Completed</button>
    </div>

    <ul id="task-list" class="list"></ul>
    <p id="empty-state" class="empty hidden"></p>

    <div class="footer">
      <span id="count">0 tasks left</span>
      <button type="button" id="clear-completed" class="clear-btn">Clear completed</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'todo.tasks.v1';

    let tasks = [];
    let filter = 'all';

    const els = {
      form: document.getElementById('add-form'),
      input: document.getElementById('new-task'),
      list: document.getElementById('task-list'),
      empty: document.getElementById('empty-state'),
      count: document.getElementById('count'),
      clearCompleted: document.getElementById('clear-completed'),
      filters: Array.from(document.querySelectorAll('.filters button'))
    };

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        tasks = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(tasks)) tasks = [];
      } catch {
        tasks = [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function visibleTasks() {
      if (filter === 'active') return tasks.filter(t => !t.completed);
      if (filter === 'completed') return tasks.filter(t => t.completed);
      return tasks;
    }

    function render() {
      const list = visibleTasks();
      els.list.innerHTML = '';

      if (tasks.length === 0) {
        els.empty.textContent = 'No tasks yet. Add one above.';
        els.empty.classList.remove('hidden');
      } else if (list.length === 0) {
        els.empty.textContent = filter === 'completed'
          ? 'No completed tasks yet.'
          : 'All done. Nice work!';
        els.empty.classList.remove('hidden');
      } else {
        els.empty.classList.add('hidden');
      }

      list.forEach(task => {
        const li = document.createElement('li');
        if (task.completed) li.classList.add('completed');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = task.completed;
        checkbox.setAttribute('aria-label', 'Mark \u201C' + task.text + '\u201D as ' + (task.completed ? 'active' : 'complete'));
        checkbox.addEventListener('change', () => toggle(task.id));

        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = task.text;

        const actions = document.createElement('div');
        actions.className = 'item-actions';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'icon-btn';
        editBtn.title = 'Edit';
        editBtn.textContent = '\u270E';
        editBtn.setAttribute('aria-label', 'Edit task');
        editBtn.addEventListener('click', () => startEdit(li, span, task));

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'icon-btn delete';
        deleteBtn.title = 'Delete';
        deleteBtn.textContent = '\u2715';
        deleteBtn.setAttribute('aria-label', 'Delete task');
        deleteBtn.addEventListener('click', () => remove(task.id));

        actions.append(editBtn, deleteBtn);
        li.append(checkbox, span, actions);
        els.list.appendChild(li);
      });

      renderCount();
    }

    function renderCount() {
      const remaining = tasks.filter(t => !t.completed).length;
      els.count.textContent = remaining === 1 ? '1 task left' : remaining + ' tasks left';
      els.clearCompleted.style.display = tasks.some(t => t.completed) ? '' : 'none';
    }

    function add(text) {
      const trimmed = text.trim();
      if (!trimmed) return;
      tasks.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
        text: trimmed,
        completed: false
      });
      save();
      render();
    }

    function toggle(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        save();
        render();
      }
    }

    function remove(id) {
      tasks = tasks.filter(t => t.id !== id);
      save();
      render();
    }

    function startEdit(li, span, task) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'edit-input';
      input.value = task.text;
      li.replaceChild(input, span);

      let done = false;
      const commit = () => {
        if (done) return;
        done = true;
        const val = input.value.trim();
        if (val && val !== task.text) {
          task.text = val;
          save();
        }
        render();
      };
      const cancel = () => {
        done = true;
        render();
      };

      input.focus();
      input.select();
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); commit(); }
        else if (e.key === 'Escape') { e.preventDefault(); cancel(); }
      });
      input.addEventListener('blur', commit);
    }

    els.form.addEventListener('submit', e => {
      e.preventDefault();
      add(els.input.value);
      els.input.value = '';
      els.input.focus();
    });

    els.filters.forEach(btn => {
      btn.addEventListener('click', () => {
        filter = btn.dataset.filter;
        els.filters.forEach(b => b.classList.toggle('active', b === btn));
        render();
      });
    });

    els.clearCompleted.addEventListener('click', () => {
      tasks = tasks.filter(t => !t.completed);
      save();
      render();
    });

    load();
    render();
    els.input.focus();
  </script>
</body>
</html>
